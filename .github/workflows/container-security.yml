name: Container security

on:
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "package*.json", ".github/workflows/**"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: local/secure-template:ci
      - name: Scan repository configuration
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: "1"
